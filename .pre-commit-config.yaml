default_install_hook_types: [pre-commit, commit-msg, pre-push, post-checkout]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        name: Look for merge conflicts
      - id: check-case-conflict
        name: Look for case conflicts
      - id: check-yaml
        name: Validate YAML
      - id: check-added-large-files
        name: Look for large files
      - id: mixed-line-ending
        name: Fix line endings
        args: [--fix=lf]
        exclude: &generated ^(CHANGELOG\.md|bun\.lock)$
      - id: end-of-file-fixer
        name: Fix end of files
        exclude: *generated
      - id: trailing-whitespace
        name: Fix trailing whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: *generated

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        name: Ensure conventional commits
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Look for hardcoded secrets

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        name: Look for typos
        args: [--force-exclude]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: Lint GitHub Actions

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        name: Audit GitHub Actions security (zizmor)

  - repo: local
    hooks:
      - id: pinact
        name: Pin GitHub Actions
        entry: pinact run
        language: golang
        language_version: "1.27.3"
        additional_dependencies:
          - github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.2
        files: ^\.github/(workflows|actions)/.*\.ya?ml$

      - id: lint
        name: Lint (oxlint)
        entry: node_modules/.bin/oxlint --type-aware --deny-warnings --fix --no-error-on-unmatched-pattern
        language: system
        require_serial: true
        files: \.(ts|js|mjs|cjs|svelte)$

      - id: format
        name: Format and sort imports (bun fmt)
        entry: bun fmt --ignore-unknown --no-error-on-unmatched-pattern --log-level warn
        language: system
        require_serial: true

      - id: markdownlint
        name: Lint Markdown
        entry: node_modules/.bin/markdownlint-cli2
        language: system
        types: [markdown]

      - id: lint-tailwind
        name: Lint Tailwind (tailwint)
        entry: node_modules/.bin/tailwint --fix --timeout 120000
        language: system
        require_serial: true
        files: ^src/.*\.(svelte|css|html)$

      - id: check
        name: Type check
        entry: bun run check
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(src/|tests/|[^/]*\.ts$|tsconfig.*\.json$|package\.json$|bun\.lock$)

      - id: test-unit
        name: Unit tests
        entry: bun run test
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(src/|tests/|bunfig\.toml$|package\.json$|bun\.lock$)

      - id: package
        name: Package and lint the manifest (publint)
        entry: bun run build
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(src/lib/|package\.json$|bun\.lock$)

      - id: bun-install
        name: Sync dependencies after checkout
        entry: bun install
        language: system
        stages: [post-checkout]
        always_run: true
        pass_filenames: false
